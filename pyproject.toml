[build-system]
requires = [
  # >=77 for PEP 639 (license = SPDX expression, license-files).
  "setuptools>=77",
  "setuptools_scm[toml]>=8.0.0",
  "numpy",
  "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "tambora"
description = "An n-body code for the modern era."
requires-python = ">=3.10"
readme = { file = "README.md", content-type = "text/markdown" }
# GPL is required, not chosen: setup.py compiles the bundled falcON sources
# (GPL-2.0-or-later) into the _falcon extension. See licenses/LICENSE.rst.
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "licenses/*.rst"]
authors = [
  { name = "Gabriel Pfaffman", email = "gabriel.pfaffman@mail.utoronto.ca" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "tqdm",
    "h5py>=3.5"
]
dynamic = ["version"]

[project.optional-dependencies]
galpy = [
    "galpy>=1.9",
]
test = [
    "pytest",
    "pytest-doctestplus",
    "pytest-cov",
    "galpy>=1.9",
    "astropy",
]
docs = [
    "sphinx",
    "sphinx-automodapi",
    "pydata-sphinx-theme",
    "sphinx-design",
    "myst-nb>=1.1",
    "sphinx-copybutton",
    "pandoc",
    "ipykernel",
]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["tambora*"]

[tool.setuptools_scm]
version_file = "tambora/version.py"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
# Only the package is unit-tested here. Docs code correctness is enforced by
# the Sphinx build instead (myst-nb executes the User Guide cells with
# nb_execution_raise_on_error=True), so scanning docs/ for .rst doctests is
# redundant — and it made collection crawl through the heavy examples/ tree.
testpaths = [
  "tambora",
]
norecursedirs = ["tambora[\\/]_dev"]

[tool.coverage.run]
omit = [
 "tambora/__init*",
 "tambora/conftest.py",
 "tambora/*setup_package*",
 "tambora/tests/*",
 "tambora/*/tests/*",
 "tambora/extern/*",
 "tambora/version*",
 "*/tambora/__init*",
 "*/tambora/conftest.py",
 "*/tambora/*setup_package*",
 "*/tambora/tests/*",
 "*/tambora/*/tests/*",
 "*/tambora/extern/*",
 "*/tambora/version*",
]

[tool.coverage.report]
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",
  # Don't complain about packages we have installed
  "except ImportError",
  # Don't complain if tests don't hit assertions
  "raise AssertionError",
  "raise NotImplementedError",
  # Abstract method bodies are unreachable by design: the ABC cannot be
  # instantiated, and every concrete subclass overrides them.
  "@(abc\\.)?abstractmethod",
  # Don't complain about script hooks
  "def main(.*):",
  # Ignore branches that don't pertain to this version of Python
  "pragma: py{ignore_python_version}",
  # Don't complain about IPython completion helper
  "def _ipython_key_completions_",
  # typing.TYPE_CHECKING is False at runtime
  "if TYPE_CHECKING:",
  # Ignore typing overloads
  "@overload",
]
