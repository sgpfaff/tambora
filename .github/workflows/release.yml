name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: "testpypi"
        type: choice
        options: [testpypi, pypi]

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw_build: "cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64"
          - os: macos-14
            cibw_build: "cp310-macosx_x86_64 cp311-macosx_x86_64 cp312-macosx_x86_64 cp313-macosx_x86_64 cp310-macosx_arm64 cp311-macosx_arm64 cp312-macosx_arm64 cp313-macosx_arm64"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          # cibuildwheel 2.21.3 pins packaging==24.1 in the build environment,
          # but pyproject's PEP 639 SPDX license expression needs setuptools>=77,
          # which in turn requires packaging>=24.2 to canonicalize it. The pinned
          # set therefore fails with "Cannot import `packaging.licenses`" before
          # any compilation starts. "latest" drops those stale constraints.
          CIBW_DEPENDENCY_VERSIONS: latest
          # Default manylinux2014 is glibc 2.17; numpy now ships only
          # manylinux_2_28 wheels, so pip fell back to building numpy from
          # source and hit "NumPy requires GCC >= 10.3" against the image's
          # GCC 10.2.1. manylinux_2_28 (glibc 2.28, GCC 12+) matches what
          # numpy itself already requires of users.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # macos-14 is an Apple Silicon runner and cibuildwheel builds only the
          # native arch by default, so the macosx_x86_64 entries in CIBW_BUILD
          # silently produced nothing. Naming both archs here is what actually
          # adds Intel; the x86_64 wheels are cross-compiled and cannot be
          # executed on this runner, so they ship untested.
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to ${{ github.event_name == 'push' && 'pypi' || inputs.target }}
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
