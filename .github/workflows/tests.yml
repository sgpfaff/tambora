name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Fix hash randomization so dict/set ordering is reproducible across runs.
env:
  PYTHONHASHSEED: "0"

jobs:
  core:
    name: Core (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Verify C extensions
        working-directory: /tmp
        run: python -c "from tambora.dynamics.forces.self_gravity.falcON._falcon import gravity; print('_falcon OK')"

      - name: Run tests with coverage
        working-directory: /tmp
        run: |
          # --cov-config is required: this runs from /tmp, so coverage cannot find
          # pyproject.toml on its own and would silently ignore omit=.
          python -m pytest --pyargs tambora.tests -o "addopts=" --cov=tambora --cov-config=$GITHUB_WORKSPACE/pyproject.toml --cov-report=term-missing --cov-report=xml:$GITHUB_WORKSPACE/coverage.xml -q

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  no-galpy:
    name: Install without galpy (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tambora without [galpy] extra
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Assert galpy is not installed
        run: |
          python -c "import sys; \
            import importlib.util; \
            assert importlib.util.find_spec('galpy') is None, 'galpy unexpectedly present'"

      - name: Import tambora.simulation works without galpy
        working-directory: /tmp
        run: python -c "from tambora.simulation import Sim; print('Sim import OK')"

      - name: Asking for the galpy backend raises a helpful ImportError
        working-directory: /tmp
        run: |
          python -c "
          from tambora.dynamics.forces import ExternalPotential
          try:
              ExternalPotential(None, backend='galpy')
          except ImportError as e:
              assert 'needs galpy' in str(e) and 'docs.galpy.org' in str(e), f'unexpected message: {e}'
              print('Helpful ImportError raised as expected')
          else:
              raise SystemExit('Expected ImportError, none raised')
          "

      - name: An unusable potential says no package is installed
        working-directory: /tmp
        run: |
          python -c "
          from tambora.simulation import Sim
          try:
              Sim().add_external_pot(None)
          except TypeError as e:
              assert 'installed: none' in str(e), f'unexpected message: {e}'
              print('Helpful TypeError raised as expected')
          else:
              raise SystemExit('Expected TypeError, none raised')
          "

      - name: TidalTensorGalpyForce raises helpful ImportError
        working-directory: /tmp
        run: |
          python -c "
          from tambora.dynamics.forces import TidalTensorGalpyForce
          try:
              TidalTensorGalpyForce(None)
          except ImportError as e:
              assert 'requires galpy' in str(e), f'unexpected message: {e}'
              print('Helpful ImportError raised as expected')
          else:
              raise SystemExit('Expected ImportError, none raised')
          "

  galpy-astropy-units:
    # galpy can be configured to return astropy Quantities from every accessor
    # instead of plain floats. That is an ordinary user setting, and tambora used
    # to break under it (9 tests) because the default -- and so every CI job
    # here -- is astropy-units = False. Running the suite under BOTH settings is
    # what keeps that fixed; testing only the default is how it went unnoticed.
    #
    # This runs the *whole* suite deliberately, not just the galpy test modules:
    # when the bug was found, 7 of the 9 failures were outside them (in
    # test_LeapfrogIntegrator and test_runner), so a galpy-only run would have
    # stayed green.
    name: galpy astropy-units=${{ matrix.astropy-units }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        astropy-units: ["True", "False"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Write ~/.galpyrc with astropy-units=${{ matrix.astropy-units }}
        # galpy resolves its config from ./.galpyrc then ~/.galpyrc, and writes a
        # default if neither exists. Tests run from /tmp, so $HOME is the reliable
        # location. version-check is off: it makes a network call on import.
        run: |
          cat > ~/.galpyrc <<'EOF'
          [normalization]
          ro = 8.
          vo = 220.

          [astropy]
          astropy-units = ${{ matrix.astropy-units }}
          astropy-coords = True

          [plot]
          seaborn-bovy-defaults = False

          [warnings]
          verbose = False

          [version-check]
          do-check = False
          EOF
          cat ~/.galpyrc

      - name: Assert galpy actually honoured the setting
        # Without this the job could pass vacuously: if the rc were ignored, both
        # matrix legs would silently run the default and prove nothing.
        working-directory: /tmp
        run: |
          python -c "
          from galpy.util import config
          got = config.__config__.get('astropy', 'astropy-units')
          want = '${{ matrix.astropy-units }}'
          assert got.strip().lower() == want.strip().lower(), \
              f'.galpyrc not honoured: galpy reports {got!r}, expected {want!r}'
          print(f'confirmed astropy-units = {got}')
          "

      - name: Assert the setting reaches a real accessor
        # Belt and braces: prove Quantities are (or are not) actually returned,
        # rather than trusting the config object alone.
        working-directory: /tmp
        run: |
          python -c "
          from astropy.units import Quantity
          from galpy.orbit import Orbit
          o = Orbit([1., 0., 1., 0., 0., 0.], ro=8., vo=220.)
          o.turn_physical_on()
          is_q = isinstance(o.x(), Quantity)
          want = '${{ matrix.astropy-units }}'.strip().lower() == 'true'
          assert is_q == want, f'Orbit.x() Quantity={is_q}, expected {want}'
          print(f'confirmed Orbit.x() returns Quantity={is_q}')
          "

      - name: Run full suite
        working-directory: /tmp
        run: python -m pytest --pyargs tambora.tests -o "addopts=" -q

  galpy-compat:
    # pyproject declares galpy>=1.9, so every minor from 1.9 to the current
    # release is supported and must be pinned here explicitly.
    name: galpy ${{ matrix.galpy-version }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        galpy-version: ["1.9", "1.10", "1.11", "1.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          pip install "galpy==${{ matrix.galpy-version }}.*"

      - name: Pin scipy for older galpy
        if: matrix.galpy-version == '1.9'
        run: pip install "scipy<1.14"

      - name: Confirm the pinned galpy is the one under test
        # pip resolves ".[test]" first and the pin second; if the pin were ever
        # silently skipped, every leg would test the same version and prove
        # nothing.
        working-directory: /tmp
        run: |
          python -c "
          import galpy
          got, want = galpy.__version__, '${{ matrix.galpy-version }}'
          assert got.startswith(want), f'pinned {want}, got {got}'
          print(f'confirmed galpy {got}')
          "

      - name: Run full suite
      
        working-directory: /tmp
        run: |
          python -m pytest --pyargs tambora.tests -o "addopts=" -q
